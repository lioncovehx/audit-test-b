[project]
name = "textkit"
version = "0.3.1"
requires-python = ">=3.10"
dependencies = ["unidecode>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
