name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: fastci-tools/cache-deps@main
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Run tests
        run: pytest -q
        continue-on-error: true
